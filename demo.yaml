---
substitutions:
  name: voice-pe-demo
  friendly_name: voice-pe-demo
  log_level: INFO
  wifi_static_ip: 10.8.60.54
  api_encryption_key: !secret api_encryption_key
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password

packages:
  # Nabu Casa.Home Assistant Voice PE: github://esphome/home-assistant-voice-pe/home-assistant-voice.yaml@dev
  # Open Voice.PE Custom: github://bmcwilliams96/open-voice-pe-custom/open-voice-pe.yaml@main
  - !include ./open-voice-pe.yaml

wifi:
  id: wifi_id
  networks:
    - ssid: ${wifi_ssid}
      password: ${wifi_password}
      priority: 0.0
      manual_ip:
        static_ip: ${wifi_static_ip}
        gateway: 10.8.60.1
        subnet: 255.255.254.0
        dns1: 10.8.60.1
  use_address: ${wifi_static_ip}
