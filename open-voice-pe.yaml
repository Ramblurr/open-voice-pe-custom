# Open Voice PE
#
# An overlay on top of the official Home Assistant Voice Preview Edition firmware.
# Include it as a package from your device config (see demo.yaml). The device
# config must provide these substitutions: name, friendly_name, api_encryption_key.
#
# What it changes compared to the official firmware:
#   - No on-device wake word. Audio is streamed to Home Assistant continuously and
#     the wake word is detected there (for example with the openWakeWord add-on).
#     The wake word itself is therefore a property of the Assist pipeline that is
#     selected for this device in Home Assistant.
#   - TTS responses can be routed to a remote assist_satellite or media_player
#     entity instead of the local speaker. The targets are selects that you extend
#     per device with `!extend`.
#   - Follow-up conversations keep working on every route: the device resumes
#     listening only after the response finished playing, and the ESPHome voice
#     assistant decides on its own whether the next turn needs a wake word.
#
# Requires ESPHome 2026.9.0 or newer and Home Assistant with "Allow the device to
# perform Home Assistant actions" enabled for this device.

substitutions:
  version: "2.0.0"
  # How long to wait after a remote media_player accepted the TTS before the device
  # resumes listening. media_player.play_media returns when playback starts, not
  # when it ends, so this is an estimate. assist_satellite targets do not need it.
  tts_media_player_resume_delay: 3s
  # Safety net: resume listening even if Home Assistant never reports that a remote
  # announcement finished.
  tts_playback_watchdog: 120s

packages:
  upstream:
    url: https://github.com/esphome/home-assistant-voice-pe
    ref: 26.9.0
    files: [home-assistant-voice.yaml]
    refresh: 1d

  # Strip the parts of the official firmware that depend on micro_wake_word or on
  # the voice assistant driving the local media player.
  #
  # Package layers merge from the highest priority down, so a key can only be
  # removed outright or appended to; it cannot be removed and redefined under the
  # same name. Everything in this layer is therefore a pure removal. The replaced
  # behaviour lives under other hooks further down (api.on_client_connected,
  # voice_assistant.on_tts_end, and a second !extend of timer_ringing).
  open_voice_pe_removals:
    micro_wake_word: !remove
    select:
      - id: !remove wake_word_sensitivity
    script:
      - id: !remove activate_stop_word_once
    switch:
      - id: !extend timer_ringing
        on_turn_on: !remove
        on_turn_off: !remove
    voice_assistant:
      micro_wake_word: !remove
      media_player: !remove
      on_client_connected: !remove
      on_intent_progress: !remove
      on_tts_start: !remove

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false

api:
  encryption:
    key: ${api_encryption_key}
  # Appended to the upstream handler. Home Assistant subscribes to the voice
  # assistant right after connecting; resume_listening waits for that.
  on_client_connected:
    - script.execute: resume_listening

globals:
  # Whether the user wants the device to listen at all (persisted).
  - id: voice_assistant_enabled_state
    type: bool
    restore_value: true
    initial_value: 'true'
  # True while a TTS response is still playing somewhere (local or remote). While
  # set, the voice assistant is not restarted by on_end.
  - id: tts_playback_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  # True when the current pipeline run began with a wake word, false for a
  # follow-up turn. Decides whether the remote satellite plays its chime.
  - id: run_started_by_wake_word
    type: bool
    restore_value: no
    initial_value: 'false'

select:
  # Remote assist_satellite that plays the TTS response when "Use Satellite for
  # TTS" is on. Extend the options per device:
  #   select:
  #     - id: !extend tts_target_satellite
  #       options:
  #         - assist_satellite.kitchen_announce_satellite_assist_satellite
  - platform: template
    name: "TTS target satellite"
    id: tts_target_satellite
    icon: mdi:satellite-variant
    options:
      - "none"
    initial_option: "none"
    restore_value: true
    entity_category: config
    optimistic: true
    on_value:
      - logger.log:
          format: "TTS target satellite set to: %s"
          args: [x.c_str()]
          level: DEBUG

  # Remote media_player that plays the TTS response when "Use Satellite for TTS"
  # is off. "none" means the local speaker.
  - platform: template
    name: "TTS target media player"
    id: tts_target_media_player
    icon: mdi:speaker
    options:
      - "none"
    initial_option: "none"
    restore_value: true
    entity_category: config
    optimistic: true
    on_value:
      - logger.log:
          format: "TTS target media player set to: %s"
          args: [x.c_str()]
          level: DEBUG

switch:
  - platform: template
    id: use_satellite_for_tts
    name: "Use Satellite for TTS"
    icon: mdi:cast-audio
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - logger.log:
          format: "TTS output mode: Assist Satellite"
          level: INFO
    on_turn_off:
      - logger.log:
          format: "TTS output mode: Media Player"
          level: INFO

  - platform: template
    id: voice_assistant_enabled
    name: Voice Assistant Enabled
    icon: mdi:ear-hearing
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(voice_assistant_enabled_state) = true;
      - script.execute: resume_listening
    turn_off_action:
      - lambda: id(voice_assistant_enabled_state) = false;
      - voice_assistant.stop

  # Same as upstream, minus the micro_wake_word "stop" model handling.
  - id: !extend timer_ringing
    on_turn_off:
      - script.execute: disable_repeat
      - if:
          condition:
            media_player.is_announcing:
              id: external_media_player
          then:
            media_player.stop:
              announcement: true
              id: external_media_player
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 0
          duration: 1.0s
      - script.execute: control_leds
    on_turn_on:
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 20
          duration: 0.0s
      - script.execute: ring_timer
      - script.execute: control_leds
      - delay: 15min
      - switch.turn_off: timer_ringing

script:
  # (Re)start the voice assistant so it streams audio to Home Assistant for wake
  # word detection. If the previous turn asked for a follow-up, the ESPHome voice
  # assistant component skips the wake word on its own.
  - id: resume_listening
    mode: restart
    then:
      - wait_until:
          condition:
            voice_assistant.connected:
          timeout: 30s
      - if:
          condition:
            and:
              - lambda: return id(voice_assistant_enabled_state);
              - voice_assistant.connected:
              - not:
                  voice_assistant.is_running:
          then:
            - lambda: |-
                id(init_in_progress) = false;
                id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
            - voice_assistant.start:
                silence_detection: true
            - script.execute: control_leds

  # Called when a TTS response finished playing (or we gave up waiting).
  - id: tts_playback_finished
    mode: restart
    then:
      - script.stop: tts_playback_watchdog
      - lambda: id(tts_playback_pending) = false;
      - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
      - script.execute: control_leds
      - script.execute: resume_listening

  - id: tts_playback_watchdog
    mode: restart
    then:
      - delay: ${tts_playback_watchdog}
      - if:
          condition:
            lambda: return id(tts_playback_pending);
          then:
            - logger.log:
                format: "TTS playback did not report completion, resuming listening"
                level: WARN
            - script.execute: tts_playback_finished

voice_assistant:
  # Wake word detection happens in Home Assistant.
  use_wake_word: true

  # Appended to the upstream handler.
  on_client_disconnected:
    - script.stop: tts_playback_watchdog
    - lambda: id(tts_playback_pending) = false;

  # Appended to the upstream handler, which only updates the LEDs.
  # The component keeps the "continue conversation" flag from the last
  # intent until the next intent or a stop. After an error there is no next
  # intent, so without this stop a failed follow-up turn would make every later
  # start skip the wake word. Wake word stage errors are excluded: the flag
  # cannot be set when the pipeline was waiting for a wake word.
  on_error:
    - if:
        condition:
          and:
            - lambda: return code != "wake-word-timeout";
            - lambda: return code != "wake_word_detection_aborted";
            - lambda: return code != "no_wake_word";
            - lambda: return code != "duplicate_wake_up_detected";
        then:
          - voice_assistant.stop

  # Appended to the upstream handler. Every pipeline run starts here; only runs
  # that go through the wake word stage set the flag again below.
  on_start:
    - lambda: id(run_started_by_wake_word) = false;

  on_wake_word_detected:
    - lambda: id(run_started_by_wake_word) = true;
    - if:
        condition:
          switch.is_on: wake_sound
        then:
          - script.execute:
              id: play_sound
              priority: true
              sound_file: "wake_word_triggered_sound"

  # Route the TTS response. x is the URL of the generated audio.
  # (Upstream's on_tts_start is removed because it depends on the stop wake word;
  # the "replying" phase starts here instead, a fraction of a second later.)
  on_tts_end:
    - lambda: |-
        id(tts_playback_pending) = true;
        id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
    - script.execute: control_leds
    - script.execute: tts_playback_watchdog
    - if:
        condition:
          and:
            - switch.is_on: use_satellite_for_tts
            - lambda: |-
                auto target = id(tts_target_satellite).current_option().str();
                return !target.empty() && target != "none" && target != "unknown";
        then:
          # assist_satellite.announce blocks in Home Assistant until the remote
          # finished playing, and on_success fires when the call returns.
          - logger.log:
              format: "TTS -> satellite %s"
              args: [id(tts_target_satellite).current_option().c_str()]
              level: DEBUG
          - homeassistant.action:
              action: assist_satellite.announce
              data:
                entity_id: !lambda return id(tts_target_satellite).current_option().str();
                media_id: !lambda return x;
              # preannounce must reach Home Assistant as a real boolean, which
              # only a rendered template gives us. Chime on the first response
              # after a wake word, none on follow-up turns.
              data_template:
                preannounce: "{{ wake == '1' }}"
              variables:
                wake: !lambda 'return std::string(id(run_started_by_wake_word) ? "1" : "0");'
              on_success:
                - script.execute: tts_playback_finished
              on_error:
                - logger.log:
                    format: "assist_satellite.announce failed: %s"
                    args: [error.c_str()]
                    level: WARN
                - script.execute: tts_playback_finished
        else:
          - if:
              condition:
                lambda: |-
                  auto target = id(tts_target_media_player).current_option().str();
                  return !target.empty() && target != "none" && target != "unknown";
              then:
                # media_player.play_media returns once playback started, so the
                # resume point can only be estimated.
                - logger.log:
                    format: "TTS -> media player %s"
                    args: [id(tts_target_media_player).current_option().c_str()]
                    level: DEBUG
                - homeassistant.action:
                    action: media_player.play_media
                    data:
                      entity_id: !lambda return id(tts_target_media_player).current_option().str();
                      media_content_id: !lambda return x;
                      media_content_type: music
                      announce: "true"
                    on_success:
                      - delay: ${tts_media_player_resume_delay}
                      - script.execute: tts_playback_finished
                    on_error:
                      - logger.log:
                          format: "media_player.play_media failed: %s"
                          args: [error.c_str()]
                          level: WARN
                      - script.execute: tts_playback_finished
              else:
                - logger.log:
                    format: "TTS -> local speaker"
                    level: DEBUG
                - media_player.play_media:
                    id: external_media_player
                    media_url: !lambda return x;
                    announcement: true
                - wait_until:
                    condition:
                      media_player.is_announcing:
                        id: external_media_player
                    timeout: 5s
                - wait_until:
                    condition:
                      not:
                        media_player.is_announcing:
                          id: external_media_player
                    timeout: 90s
                - script.execute: tts_playback_finished

  # Appended to the upstream handler, which resets the phase to idle. If the
  # response is still playing keep showing "replying" and let
  # tts_playback_finished resume listening, otherwise resume now.
  on_end:
    - if:
        condition:
          lambda: return id(tts_playback_pending);
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
          - script.execute: control_leds
        else:
          - script.execute: resume_listening
